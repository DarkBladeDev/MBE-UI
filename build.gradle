plugins {
    id 'java-library'
}

group = 'com.mbe.addons.ui'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    
    ivy {
        url 'https://github.com/DarkBladeDev/MultiBlockEngine/releases/download'
        patternLayout {
            artifact '[revision]/[artifact]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}

dependencies {
    compileOnly libs.paper.api
    def localEngineJar = file('../../build/libs/MultiBlockEngine-dev.jar')
    if (localEngineJar.exists()) {
        compileOnly files(localEngineJar)
        testImplementation files(localEngineJar)
    } else {
        compileOnly "DarkBladeDev:MultiBlockEngine:0.2.6-beta@jar"
        testImplementation "DarkBladeDev:MultiBlockEngine:0.2.6-beta@jar"
    }

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation libs.junit.jupiter
    testImplementation libs.paper.api
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('jar') {
    archiveBaseName = 'MBE-UI'
}

tasks.named('processResources') {
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation'])
}

tasks.named('test') {
    useJUnitPlatform()
}
